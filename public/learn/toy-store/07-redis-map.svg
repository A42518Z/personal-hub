<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540"><rect width="960" height="540" rx="36" fill="#FFF7ED"/><text x="480" y="66" text-anchor="middle" font-size="34" font-weight="900" fill="#9A3412">Redis：先查小本子，再查大仓库</text><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#EA580C"/></marker></defs><rect x="90" y="200" width="150" height="100" rx="26" fill="#DBEAFE" stroke="#2563EB" stroke-width="5"/><text x="165" y="260" text-anchor="middle" font-size="24" font-weight="900" fill="#1D4ED8">请求</text><rect x="345" y="140" width="220" height="140" rx="28" fill="#FEE2E2" stroke="#EF4444" stroke-width="6"/><text x="455" y="195" text-anchor="middle" font-size="28" font-weight="900" fill="#B91C1C">Redis 小本子</text><text x="455" y="232" text-anchor="middle" font-size="20" fill="#B91C1C">快，但放常用数据</text><rect x="675" y="245" width="220" height="145" rx="28" fill="#DCFCE7" stroke="#16A34A" stroke-width="6"/><text x="785" y="302" text-anchor="middle" font-size="28" font-weight="900" fill="#166534">MySQL 大仓库</text><text x="785" y="338" text-anchor="middle" font-size="20" fill="#166534">可靠，长期保存</text><path d="M242 238H340" stroke="#EA580C" stroke-width="8" marker-end="url(#a)"/><text x="290" y="220" text-anchor="middle" font-size="18" font-weight="700" fill="#9A3412">先看</text><path d="M566 246 C620 250 635 266 672 294" stroke="#EA580C" stroke-width="8" fill="none" marker-end="url(#a)"/><text x="620" y="235" text-anchor="middle" font-size="18" font-weight="700" fill="#9A3412">没有再去</text><path d="M690 386 C595 450 450 426 452 286" stroke="#16A34A" stroke-width="8" fill="none" marker-end="url(#a)"/><text x="555" y="450" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">查到后回填</text><g font-size="17" font-weight="800" fill="#B91C1C"><text x="455" y="260" text-anchor="middle">验证码 / 登录状态 / 热门商品</text></g></svg>