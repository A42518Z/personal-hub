<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">网上玩具店：JDK JRE JVM</title>
  <desc id="desc">卡通风格图示，JDK 是完整平台，JRE 是运行地基，JVM 是翻译机兼清洁机器人。</desc>
  <rect width="960" height="540" rx="36" fill="#FFF7ED"/>
  <rect x="84" y="70" width="792" height="390" rx="36" fill="#FFFFFF" stroke="#FB923C" stroke-width="7"/>
  <text x="480" y="123" text-anchor="middle" font-size="34" font-weight="900" fill="#9A3412">JDK：完整 Java 平台</text>

  <rect x="150" y="160" width="660" height="250" rx="30" fill="#FFEDD5" stroke="#F97316" stroke-width="5"/>
  <text x="480" y="202" text-anchor="middle" font-size="28" font-weight="800" fill="#C2410C">JRE：运行平台</text>

  <rect x="300" y="238" width="360" height="132" rx="28" fill="#E0F2FE" stroke="#0284C7" stroke-width="5"/>
  <text x="480" y="275" text-anchor="middle" font-size="26" font-weight="800" fill="#075985">JVM</text>
  <text x="480" y="309" text-anchor="middle" font-size="21" fill="#075985">翻译机 + 清洁机器人</text>

  <circle cx="390" cy="332" r="22" fill="#FDE68A" stroke="#92400E" stroke-width="3"/>
  <rect x="370" y="352" width="40" height="38" rx="11" fill="#38BDF8"/>
  <rect x="538" y="326" width="62" height="58" rx="16" fill="#A7F3D0" stroke="#047857" stroke-width="3"/>
  <circle cx="555" cy="344" r="5" fill="#064E3B"/><circle cx="582" cy="344" r="5" fill="#064E3B"/>
  <path d="M555 363 Q568 374 582 363" fill="none" stroke="#064E3B" stroke-width="4" stroke-linecap="round"/>

  <rect x="122" y="322" width="130" height="58" rx="16" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="4"/>
  <text x="187" y="358" text-anchor="middle" font-size="22" font-weight="700" fill="#5B21B6">.java</text>
  <rect x="706" y="322" width="130" height="58" rx="16" fill="#ECFEFF" stroke="#06B6D4" stroke-width="4"/>
  <text x="771" y="358" text-anchor="middle" font-size="22" font-weight="700" fill="#0E7490">.class</text>
  <path d="M252 350 H292" stroke="#7C3AED" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M662 350 H704" stroke="#0284C7" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="186" y="218" width="130" height="58" rx="16" fill="#FEF3C7" stroke="#F59E0B" stroke-width="4"/>
  <text x="251" y="253" text-anchor="middle" font-size="21" font-weight="700" fill="#92400E">javac</text>
  <rect x="646" y="218" width="130" height="58" rx="16" fill="#DCFCE7" stroke="#22C55E" stroke-width="4"/>
  <text x="711" y="253" text-anchor="middle" font-size="20" font-weight="700" fill="#166534">类库地基</text>

  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0284C7"/></marker></defs>
</svg>
