<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">网上玩具店：Java Web 基础</title>
  <desc id="desc">卡通风格图示，客人向 Tomcat 接电话机器发送 Request，后端用 Response 回复，并用 Cookie Session 记住身份。</desc>
  <rect width="960" height="540" rx="36" fill="#ECFEFF"/>
  <rect x="82" y="92" width="220" height="322" rx="34" fill="#FFFFFF" stroke="#06B6D4" stroke-width="6"/>
  <text x="192" y="142" text-anchor="middle" font-size="28" font-weight="900" fill="#0E7490">网页客人</text>
  <circle cx="192" cy="228" r="40" fill="#FDE68A" stroke="#92400E" stroke-width="4"/>
  <rect x="150" y="264" width="84" height="88" rx="22" fill="#60A5FA"/>
  <rect x="142" y="360" width="100" height="36" rx="16" fill="#FBCFE8"/>
  <text x="192" y="384" text-anchor="middle" font-size="18" font-weight="700" fill="#9D174D">我要买玩具</text>

  <rect x="386" y="132" width="190" height="220" rx="34" fill="#FFF7ED" stroke="#F97316" stroke-width="6"/>
  <text x="481" y="182" text-anchor="middle" font-size="28" font-weight="900" fill="#C2410C">Tomcat</text>
  <rect x="426" y="218" width="110" height="82" rx="22" fill="#FDBA74"/>
  <circle cx="456" cy="254" r="9" fill="#7C2D12"/>
  <circle cx="506" cy="254" r="9" fill="#7C2D12"/>
  <path d="M455 278 Q481 294 507 278" fill="none" stroke="#7C2D12" stroke-width="5" stroke-linecap="round"/>
  <text x="481" y="326" text-anchor="middle" font-size="18" fill="#9A3412">接电话机器</text>

  <rect x="682" y="92" width="196" height="322" rx="34" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="6"/>
  <text x="780" y="142" text-anchor="middle" font-size="28" font-weight="900" fill="#5B21B6">Java 后端</text>
  <rect x="718" y="190" width="124" height="58" rx="16" fill="#EDE9FE"/>
  <text x="780" y="226" text-anchor="middle" font-size="21" font-weight="700" fill="#5B21B6">看纸条</text>
  <rect x="718" y="272" width="124" height="58" rx="16" fill="#DCFCE7"/>
  <text x="780" y="308" text-anchor="middle" font-size="21" font-weight="700" fill="#166534">回结果</text>
  <rect x="718" y="354" width="124" height="40" rx="14" fill="#FEF3C7"/>
  <text x="780" y="380" text-anchor="middle" font-size="18" font-weight="700" fill="#92400E">记住你是谁</text>

  <path d="M302 226 C340 202 360 204 386 220" fill="none" stroke="#0891B2" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow1)"/>
  <rect x="310" y="166" width="96" height="44" rx="14" fill="#FFFFFF" stroke="#0891B2" stroke-width="3"/>
  <text x="358" y="194" text-anchor="middle" font-size="18" font-weight="700" fill="#0E7490">Request</text>

  <path d="M576 262 C628 250 648 230 682 220" fill="none" stroke="#7C3AED" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow2)"/>
  <path d="M682 312 C624 340 600 342 576 310" fill="none" stroke="#16A34A" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow3)"/>
  <rect x="580" y="348" width="106" height="44" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="3"/>
  <text x="633" y="376" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">Response</text>

  <defs>
    <marker id="arrow1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891B2"/></marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7C3AED"/></marker>
    <marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16A34A"/></marker>
  </defs>
</svg>
