site:
  name: Personal Hub
  site: 'https://personal-hub.local'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: null

metadata:
  title:
    default: Personal Hub
    template: '%s — Personal Hub'
  description: '一个集合博客、导航、项目、工具箱、前端实验室和服务状态的个人集网站。'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Personal Hub
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: ''
    site: ''
    cardType: summary_large_image

i18n:
  language: zh-CN
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%'
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog'
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'system'
